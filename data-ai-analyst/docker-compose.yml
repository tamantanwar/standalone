services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8080"
    environment:
      ENVIRONMENT: development
      CORS_ORIGINS: '["http://localhost:3000"]'
      GOOGLE_APPLICATION_CREDENTIALS: /gcp/adc.json
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-funnel-clients}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - ./backend/src:/app/src:ro
      - ${HOME}/.config/gcloud/application_default_credentials.json:/gcp/adc.json:ro
    command: ["sh", "-c", "uv run uvicorn src.main:app --host 0.0.0.0 --port 8080 --reload"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      BACKEND_URL: http://backend:8080
      NEXT_PUBLIC_APP_NAME: "Data AI Analyst"
    volumes:
      - ./frontend/src:/app/src:ro
      - ./frontend/public:/app/public:ro
    depends_on:
      - backend
